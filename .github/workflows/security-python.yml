# Reusable security pipeline for Python repositories.
#
# Call it from a repo with:
#
#   jobs:
#     security:
#       uses: Noirmiles/devsecops-pipelines/.github/workflows/security-python.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         working-directory: apps/core
#
# Same four gates as security-node.yml, with pip-audit in place of npm audit.
# See that file's header for why the gates are separate jobs, and see README.md
# for the GitHub-expression trap the blocking inputs are written around.

name: Security (Python)

on:
  workflow_call:
    inputs:
      python-version:
        description: "Python version to audit against."
        type: string
        default: "3.12"
      working-directory:
        description: "Directory containing pyproject.toml / requirements.txt."
        type: string
        default: "."
      install-command:
        description: >-
          How to install the project's dependencies so pip-audit can see the
          resolved set. Defaults to an editable install.
        type: string
        default: 'pip install -e "."'
      trivy-severity:
        type: string
        default: "CRITICAL,HIGH"
      semgrep-config:
        type: string
        default: "p/python p/security-audit p/secrets"
      enable-secrets:
        description: "Run the gitleaks secret-scanning gate."
        type: boolean
        default: true
      enable-deps:
        description: "Run the dependency-audit gate."
        type: boolean
        default: true
      enable-sast:
        description: "Run the Semgrep SAST gate."
        type: boolean
        default: true
      enable-scan:
        description: "Run the Trivy filesystem/config gate."
        type: boolean
        default: true
      blocking:
        description: >-
          When false, gates report findings without failing the build.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: ${{ inputs.enable-secrets }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        env:
          BLOCKING: ${{ inputs.blocking }}
        run: |
          if [ "$BLOCKING" = "true" ]; then code=1; else code=0; fi
          gitleaks git . --redact --verbose --exit-code "$code"

  deps:
    name: Dependencies (pip-audit)
    if: ${{ inputs.enable-deps }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install project and pip-audit
        run: |
          python -m pip install --upgrade pip
          ${{ inputs.install-command }}
          pip install pip-audit

      - name: Audit
        # --skip-editable excludes the project itself: an editable install is
        # not on PyPI, so there is no advisory data to audit it against.
        #
        # Note the absence of --strict, deliberately: --strict fails on any
        # package it *skipped*, so with --skip-editable this gate could never
        # pass on a project that installs itself.
        env:
          BLOCKING: ${{ inputs.blocking }}
        run: |
          if [ "$BLOCKING" = "true" ]; then
            pip-audit --skip-editable --desc
          else
            pip-audit --skip-editable --desc || true
          fi

  sast:
    name: SAST (Semgrep)
    if: ${{ inputs.enable-sast }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install semgrep

      - name: Scan
        env:
          BLOCKING: ${{ inputs.blocking }}
          SEMGREP_RULESETS: ${{ inputs.semgrep-config }}
        run: |
          configs=""
          for c in $SEMGREP_RULESETS; do configs="$configs --config $c"; done
          if [ "$BLOCKING" = "true" ]; then gate="--error"; else gate=""; fi
          # Two outputs from one scan. `--sarif --output FILE` sends the SARIF
          # to the file and prints NOTHING to the console, so a blocking gate
          # would fail without ever saying what it blocked on -- the findings
          # existed only inside an artefact that a private repo cannot upload.
          # A gate you have to reverse-engineer is a gate people disable.
          semgrep scan $configs \
            --sarif-output=semgrep.sarif \
            --text-output=semgrep.txt \
            --metrics=off $gate

      - name: Report findings
        # Runs even when the gate above failed -- which is exactly when the
        # findings need to be readable.
        if: always()
        run: |
          if [ -s semgrep.txt ]; then
            cat semgrep.txt
            {
              echo "### Semgrep findings"
              echo '```'
              cat semgrep.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Semgrep findings." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  scan:
    name: Filesystem & config (Trivy)
    if: ${{ inputs.enable-scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # trivy-action forces a bad choice: its newest release (v0.36.0, April) is
      # four months behind its own master, so pinning the tag runs an older
      # scanner, and pinning master leaves a SHA that no tag can vouch for.
      # Installing the release directly removes the choice -- explicit version,
      # checksum-verified download, one less third-party action holding a token.
      #
      # Bump both values together; the checksum is published by the Trivy
      # release at trivy_<version>_checksums.txt.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy (SARIF for Code Scanning)
        # Never fails: --exit-code 0. The gate below is what blocks.
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy.sarif \
            --severity "$TRIVY_SEVERITY" \
            --exit-code 0

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy (gate)
        # The blocking decision is made in shell against an env var rather than
        # in a `with:` expression. A gate in this repo was once written the
        # expression way and silently stopped blocking, because an empty string
        # is falsy in a GitHub expression -- there is no shell inside a `with:`
        # block to be explicit in, and that is the whole problem.
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          BLOCKING: ${{ inputs.blocking }}
        run: |
          set -euo pipefail
          if [ "$BLOCKING" = "true" ]; then code=1; else code=0; fi
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format table \
            --severity "$TRIVY_SEVERITY" \
            --exit-code "$code"
