# Reusable security pipeline for Node / Next.js repositories.
#
# Call it from a repo with:
#
#   jobs:
#     security:
#       uses: Noirmiles/devsecops-pipelines/.github/workflows/security-node.yml@main
#       permissions:
#         contents: read
#         security-events: write
#       with:
#         working-directory: .
#
# Four gates, each owning one class of risk, running as parallel jobs:
#
#   secrets   credentials committed by mistake      gitleaks (full history)
#   deps      known CVEs in what we imported        npm audit
#   sast      flaws in what we wrote                Semgrep
#   scan      vulns, secrets and misconfiguration   Trivy
#
# They are separate jobs rather than steps in one so a Semgrep failure still
# tells you whether your dependencies are clean. A single combined job stops at
# the first failure, hides the other three results, and turns one fix into three
# sequential pipeline runs.
#
# There is some duplication between this file and security-python.yml. That is
# deliberate: a reader can understand either file top to bottom without chasing
# indirection, and CI is read far more often under pressure than it is edited.

name: Security (Node)

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node major version to test against."
        type: string
        default: "20"
      working-directory:
        description: "Directory containing package.json. Use '.' for repo root."
        type: string
        default: "."
      trivy-severity:
        description: "Severities Trivy treats as blocking."
        type: string
        default: "CRITICAL,HIGH"
      npm-audit-level:
        description: "Lowest npm audit severity that fails the build."
        type: string
        default: "high"
      semgrep-config:
        description: "Space-separated Semgrep rulesets."
        type: string
        default: "p/javascript p/typescript p/react p/security-audit p/secrets"
      enable-secrets:
        description: "Run the gitleaks secret-scanning gate."
        type: boolean
        default: true
      enable-deps:
        description: "Run the dependency-audit gate."
        type: boolean
        default: true
      enable-sast:
        description: "Run the Semgrep SAST gate."
        type: boolean
        default: true
      enable-scan:
        description: "Run the Trivy filesystem/config gate."
        type: boolean
        default: true
      blocking:
        description: >-
          When false, gates report findings without failing the build. Use for
          onboarding a repo with an existing backlog, then switch to true.
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  secrets:
    name: Secrets (gitleaks)
    if: ${{ inputs.enable-secrets }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history. A secret deleted from the working tree is still live
          # if it is reachable in an earlier commit, and scanning only the tip
          # is the most common way secret scanning gives false assurance.
          fetch-depth: 0

      # Installed from the release archive with a verified checksum rather than
      # via gitleaks-action: the action derives a commit range from the push
      # event and, when there is no valid range, scans zero bytes and still
      # exits non-zero -- a failure indistinguishable from a real finding.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
        run: |
          set -euo pipefail
          url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$url" -o gitleaks.tar.gz
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Scan full history
        # --redact so a detected secret is never echoed into build logs, which
        # would publish the very thing this gate exists to catch.
        env:
          BLOCKING: ${{ inputs.blocking }}
        run: |
          if [ "$BLOCKING" = "true" ]; then code=1; else code=0; fi
          gitleaks git . --redact --verbose --exit-code "$code"

  deps:
    name: Dependencies (npm audit)
    if: ${{ inputs.enable-deps }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: ${{ inputs.node-version }}

      - name: Audit
        # `npm audit` reads the lockfile, so it needs no install and cannot be
        # tricked by a postinstall script in a package it is auditing.
        #
        # The blocking choice is made in shell, not in a ${{ }} expression.
        # `inputs.blocking && '' || '|| true'` looks like a ternary and is not:
        # an empty string is FALSY in GitHub expressions, so the `&&` branch
        # falls through to the `||` branch and blocking:true would silently
        # append `|| true` -- disabling the gate it was meant to enforce.
        # A gate that fails open is worse than no gate, because it reports green.
        env:
          BLOCKING: ${{ inputs.blocking }}
          LEVEL: ${{ inputs.npm-audit-level }}
        run: |
          if [ "$BLOCKING" = "true" ]; then
            npm audit --audit-level="$LEVEL"
          else
            npm audit --audit-level="$LEVEL" || true
          fi

      - name: Audit report (always visible)
        # Runs even when the gate above failed, so the findings are on the run
        # page rather than only in a collapsed failed step.
        if: always()
        env:
          LEVEL: ${{ inputs.npm-audit-level }}
        run: |
          {
            echo "### npm audit — \`${{ inputs.working-directory }}\`"
            echo '```'
            npm audit --audit-level="$LEVEL" 2>&1 | head -80 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  sast:
    name: SAST (Semgrep)
    if: ${{ inputs.enable-sast }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - run: pip install semgrep

      - name: Scan
        # Explicit rulesets rather than --config=auto: auto resolves rules over
        # the network at run time, so the checks applied to a given commit are
        # neither reproducible nor reviewable.
        env:
          BLOCKING: ${{ inputs.blocking }}
          SEMGREP_RULESETS: ${{ inputs.semgrep-config }}
        run: |
          configs=""
          for c in $SEMGREP_RULESETS; do configs="$configs --config $c"; done
          if [ "$BLOCKING" = "true" ]; then gate="--error"; else gate=""; fi
          # Two outputs from one scan. `--sarif --output FILE` sends the SARIF
          # to the file and prints NOTHING to the console, so a blocking gate
          # would fail without ever saying what it blocked on -- the findings
          # existed only inside an artefact that a private repo cannot upload.
          # A gate you have to reverse-engineer is a gate people disable.
          semgrep scan $configs \
            --sarif-output=semgrep.sarif \
            --text-output=semgrep.txt \
            --metrics=off $gate

      - name: Report findings
        # Runs even when the gate above failed -- which is exactly when the
        # findings need to be readable.
        if: always()
        run: |
          if [ -s semgrep.txt ]; then
            cat semgrep.txt
            {
              echo "### Semgrep findings"
              echo '```'
              cat semgrep.txt
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No Semgrep findings." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload SARIF
        # Private repos need GitHub Advanced Security for Code Scanning upload.
        # The scan already failed the job above if it found anything, so a
        # failed upload must never mask a passing scan.
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: semgrep.sarif
          category: semgrep

  scan:
    name: Filesystem & config (Trivy)
    if: ${{ inputs.enable-scan }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Two passes on purpose. The SARIF pass never fails, so findings always
      # reach the Security tab even when the gate trips; the table pass is the
      # gate and prints a readable summary. One pass cannot do both, because a
      # non-zero exit skips the upload.
      # trivy-action forces a bad choice: its newest release (v0.36.0, April) is
      # four months behind its own master, so pinning the tag runs an older
      # scanner, and pinning master leaves a SHA that no tag can vouch for.
      # Installing the release directly removes the choice -- explicit version,
      # checksum-verified download, one less third-party action holding a token.
      #
      # Bump both values together; the checksum is published by the Trivy
      # release at trivy_<version>_checksums.txt.
      - name: Install Trivy
        env:
          TRIVY_VERSION: "0.74.0"
          TRIVY_SHA256: "2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a"
        run: |
          set -euo pipefail
          url="https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -sSfL "$url" -o trivy.tar.gz
          echo "${TRIVY_SHA256}  trivy.tar.gz" | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
          sudo install -m 0755 trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy (SARIF for Code Scanning)
        # Never fails: --exit-code 0. The gate below is what blocks.
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
        run: |
          set -euo pipefail
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format sarif \
            --output trivy.sarif \
            --severity "$TRIVY_SEVERITY" \
            --exit-code 0

      - name: Upload SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@6f5948dfacef28e207b48d0905cf90c03365536d # v3
        with:
          sarif_file: trivy.sarif
          category: trivy

      - name: Trivy (gate)
        # The blocking decision is made in shell against an env var rather than
        # in a `with:` expression. The npm-audit gate in this file was written
        # the expression way and silently stopped blocking, because an empty
        # string is falsy in a GitHub expression -- there is no shell inside a
        # `with:` block to be explicit in, and that is the whole problem.
        env:
          TRIVY_SEVERITY: ${{ inputs.trivy-severity }}
          BLOCKING: ${{ inputs.blocking }}
        run: |
          set -euo pipefail
          if [ "$BLOCKING" = "true" ]; then code=1; else code=0; fi
          trivy fs . \
            --scanners vuln,secret,misconfig \
            --format table \
            --severity "$TRIVY_SEVERITY" \
            --exit-code "$code"
